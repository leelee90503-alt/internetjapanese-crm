<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Management System (CRM)</title>
  <link rel="stylesheet" href="./style.css" />
  <!--
    This app runs directly in the browser with no build step (no npm install /
    vite build). It's written in plain JavaScript (ES modules) instead of
    React. The Supabase JS SDK and the Excel parsing library (xlsx) are
    loaded from a CDN via the importmap below.
    When opening locally, don't double-click the file — serve it with a
    simple local server (e.g. run `python3 -m http.server 8080` in this
    folder, then open http://localhost:8080).
  -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
        "xlsx": "https://esm.sh/xlsx@0.18.5"
      }
    }
  </script>
</head>
<body>
  <div id="app">Loading...</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
